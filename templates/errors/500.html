{% extends 'base.html' %}

{% block title %}500 Internal Server Error - Workload Dashboard{% endblock %}

{% block content %}
<div class="row justify-content-center my-5">
    <div class="col-md-6 text-center">
        <div class="card border-0 shadow-sm p-5 rounded-3">
            <div class="card-body">
                <div class="bg-danger-subtle text-danger d-inline-block p-4 rounded-circle mb-4">
                    <i class="bi bi-bug-fill fs-1"></i>
                </div>
                <h2 class="fw-bold text-dark mb-2">500 - Internal Server Error</h2>
                <p class="lead text-muted">An unexpected internal application error occurred. Please try again or return to the main dashboard.</p>
                <hr class="my-4">
                <a href="{{ url_for('dashboard.dashboard') }}" class="btn btn-primary px-4 py-2 fw-bold shadow-sm">
                    <i class="bi bi-house-door me-1"></i> Return to Dashboard
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
